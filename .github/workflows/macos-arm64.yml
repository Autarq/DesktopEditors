name: macOS ARM64

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Run the full macOS app build
        type: boolean
        default: true
  push:
    branches:
      - autarq-office
    paths:
      - ".github/workflows/macos-arm64.yml"
      - "build/macos/**"
      - "build/README.md"
      - "core"
      - "core-fonts"
      - "desktop-apps"
      - "desktop-sdk"
      - "dictionaries"
      - "document-templates"
      - "sdkjs"
      - "sdkjs-forms"
      - "web-apps"
      - ".gitmodules"
  pull_request:
    paths:
      - ".github/workflows/macos-arm64.yml"
      - "build/macos/**"
      - "build/README.md"
      - "core"
      - "core-fonts"
      - "desktop-apps"
      - "desktop-sdk"
      - "dictionaries"
      - "document-templates"
      - "sdkjs"
      - "sdkjs-forms"
      - "web-apps"
      - ".gitmodules"

jobs:
  preflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install host tools
        run: |
          brew update
          brew install qt@5 cmake ninja jq imagemagick || true
      - name: macOS preflight
        working-directory: build
        env:
          MIN_FREE_GIB: "30"
        run: ./macos/build.sh --check

  build:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    runs-on: macos-15
    environment: release-signing
    timeout-minutes: 360
    env:
      EO_SKIP_LAUNCH: "1"
      MIN_FREE_GIB: "30"
      EO_MACOS_PRODUCTS: suite
      MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      MACOS_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
      MACOS_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8
      - name: Install host tools
        run: |
          brew update
          brew install qt@5 cmake ninja jq imagemagick || true
      - name: Build AUTARQ Office.app
        working-directory: build
        run: ./macos/build.sh arm64
      - name: Sign and notarize app when release secrets are configured
        run: |
          chmod +x build/macos/sign-notarize.sh
          build/macos/sign-notarize.sh \
            "build/deploy/macos/arm64/AUTARQ Office.app" \
            "build/deploy/macos/arm64/package/AUTARQ-Office-macOS-arm64-notary.zip"
      - name: Verify bundle
        run: |
          test -d "build/deploy/macos/arm64/AUTARQ Office.app"
          codesign --verify --deep --strict --verbose=4 "build/deploy/macos/arm64/AUTARQ Office.app"
          file "build/deploy/macos/arm64/AUTARQ Office.app/Contents/MacOS/"*
      - name: Package app artifact
        run: |
          mkdir -p build/deploy/macos/arm64/package
          ditto -c -k --sequesterRsrc --keepParent \
            "build/deploy/macos/arm64/AUTARQ Office.app" \
            "build/deploy/macos/arm64/package/AUTARQ-Office-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AUTARQ-Office-macOS-arm64
          path: build/deploy/macos/arm64/package/AUTARQ-Office-macOS-arm64.zip
          if-no-files-found: error
