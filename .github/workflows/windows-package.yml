name: Windows Package

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Build the Windows x64 desktop payload before packaging
        type: boolean
        default: true
      package_prebuilt_payload:
        description: Package an existing build_tools/out Windows payload
        type: boolean
        default: false
      arch:
        description: Windows architecture
        type: choice
        options:
          - x64
        default: x64
      installer:
        description: Build Inno Setup installer when available
        type: boolean
        default: false
  push:
    branches:
      - autarq-office
    paths:
      - ".github/workflows/windows-package.yml"
      - "build/windows/**"
      - "core"
      - "core-fonts"
      - "desktop-apps"
      - "desktop-sdk"
      - "dictionaries"
      - "document-templates"
      - "sdkjs"
      - "sdkjs-forms"
      - "web-apps"
      - "desktop-apps/package/**"
      - ".gitmodules"
  pull_request:
    paths:
      - ".github/workflows/windows-package.yml"
      - "build/windows/**"
      - "core"
      - "core-fonts"
      - "desktop-apps"
      - "desktop-sdk"
      - "dictionaries"
      - "document-templates"
      - "sdkjs"
      - "sdkjs-forms"
      - "web-apps"
      - "desktop-apps/package/**"
      - ".gitmodules"

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate Windows packaging wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("build/windows/package.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }
          [System.Management.Automation.Language.Parser]::ParseFile("build/windows/build.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }

  package:
    if: github.event_name == 'workflow_dispatch' && (inputs.full_build || inputs.package_prebuilt_payload)
    runs-on: windows-2022
    timeout-minutes: 360
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt
        if: inputs.full_build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O C:\Qt
      - name: Build Windows x64 payload
        if: inputs.full_build
        shell: pwsh
        run: ./build/windows/build.ps1 -Arch "${{ inputs.arch }}" -QtRoot "C:/Qt/5.15.2"
      - name: Package existing Windows build output
        shell: pwsh
        run: |
          $installer = [System.Convert]::ToBoolean("${{ inputs.installer }}")
          ./build/windows/package.ps1 -Arch "${{ inputs.arch }}" -Installer:$installer
      - uses: actions/upload-artifact@v4
        with:
          name: AUTARQ-Office-windows-${{ inputs.arch }}
          path: |
            desktop-apps/package/zip/*.zip
            desktop-apps/package/inno/*.exe
          if-no-files-found: error

  payload-required:
    if: github.event_name == 'workflow_dispatch' && !inputs.full_build && !inputs.package_prebuilt_payload
    runs-on: windows-2022
    needs: validate
    steps:
      - name: Explain Windows packaging boundary
        shell: pwsh
        run: |
          @"
          Windows packaging was not run because package_prebuilt_payload=false.

          This workflow validates the AUTARQ Windows packaging wrapper on hosted
          runners. Packaging requires a native Windows desktop payload under
          build_tools/out/win_*/AUTARQ/DesktopEditors, which is produced by the
          pinned build_tools Windows build outside this wrapper.

          To package an existing payload, rerun this workflow with
          package_prebuilt_payload=true on a runner/workspace where the payload
          is already present.
          "@ | Write-Host
