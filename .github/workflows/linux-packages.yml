name: Linux Packages

on:
  workflow_dispatch:
  push:
    branches:
      - autarq-office
    paths:
      - ".github/workflows/linux-packages.yml"
      - "build/**"
      - "core"
      - "core-fonts"
      - "desktop-apps"
      - "desktop-sdk"
      - "dictionaries"
      - "document-templates"
      - "sdkjs"
      - "sdkjs-forms"
      - "web-apps"
      - ".gitmodules"
  pull_request:
    paths:
      - ".github/workflows/linux-packages.yml"
      - "build/**"
      - "core"
      - "core-fonts"
      - "desktop-apps"
      - "desktop-sdk"
      - "dictionaries"
      - "document-templates"
      - "sdkjs"
      - "sdkjs-forms"
      - "web-apps"
      - ".gitmodules"

jobs:
  deb-rpm:
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 360
    env:
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8
      - uses: docker/setup-buildx-action@v3
      - name: Free runner disk
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm gnupg
          sudo gem install --no-document fpm
      - name: Build Linux desktop export
        working-directory: build
        run: docker buildx bake -f docker-bake.hcl -f docker-bake.ci.hcl --set '*.cache-from=' --set '*.cache-to=' --allow=fs=/tmp --allow=fs.read=..
      - name: Unpack Linux desktop export
        working-directory: build
        run: |
          test -f deploy/desktop.tar
          rm -rf deploy/desktop
          mkdir -p deploy/desktop
          tar -xf deploy/desktop.tar -C deploy/desktop
          rm deploy/desktop.tar
          test -x deploy/desktop/DesktopEditors
          test -f deploy/desktop/start_desktop.sh
      - name: Build deb and rpm packages
        working-directory: build
        run: ./linux/package.sh all
      - name: Sign deb and rpm packages when release secrets are configured
        working-directory: build
        run: |
          chmod +x ./linux/sign-packages.sh
          ./linux/sign-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AUTARQ-Office-linux-packages
          path: build/deploy/linux/packages/*
          if-no-files-found: error
